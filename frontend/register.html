<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Travel Planner</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <!-- Header Navbar -->
    <header class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">✈️</span> Roam<span>AI</span>
        </a>
    </header>

    <!-- Main Auth Card -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Get Started</h1>
                <p class="auth-subtitle">Create a free account to custom plan travel with AI</p>
            </div>
            
            <div class="auth-body">
                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control" placeholder="e.g. Divya Manasa">
                        <div class="form-error-msg"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="e.g. wanderer@domain.com">
                        <div class="form-error-msg"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Password (Min 6 chars)</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••">
                        <div class="form-error-msg"></div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••">
                        <div class="form-error-msg"></div>
                    </div>
                    
                    <div class="auth-btn-wrapper">
                        <button type="submit" class="btn btn-primary">Sign Up</button>
                    </div>
                </form>
                
                <div class="auth-footer">
                    Already have an account? <a href="login.html">Log In</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            &copy; 2026 RoamAI Travel Planner. All rights reserved. Built with Groq & Firebase.
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
